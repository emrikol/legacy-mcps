# Test-only overrides for the Windows 3.1 WINMCP suite.
# Loaded after dosbox-win31.conf; do not use for timing-sensitive research.

[render]
frameskip=10

[cpu]
core=dynamic
cycles=max
turbo=true
stop turbo on key=false
stop turbo after second=0
use dynamic core with paging on=true

[mixer]
nosound=true

[sblaster]
sbtype=none

[speaker]
pcspeaker=false
tandy=off
