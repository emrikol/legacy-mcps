# Normal-core remote-debugging overrides for Windows 3.1.
# Loaded after dosbox-win31.conf. The dynamic test profile now provides exact
# stepping through a temporary normal-decoder handoff; retain this profile for
# core-comparison diagnostics and normal-core regression runs.

[cpu]
core=normal
cycles=max
turbo=true
stop turbo on key=false
stop turbo after second=0

[mixer]
nosound=true

[sblaster]
sbtype=none

[speaker]
pcspeaker=false
tandy=off
